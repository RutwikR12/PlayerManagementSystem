<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-8 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">🏆 Player Management Dashboard</h1>
            <span class="text-xs bg-indigo-500 py-1 px-3 rounded-full font-medium">Spring Boot & PostgreSQL</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8 pb-12">
        
        <!-- Left Column: Add Player Form -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
            <h2 class="text-lg font-semibold text-slate-900 mb-4 pb-2 border-b">Add New Player</h2>
            <form id="playerForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
                    <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Age</label>
                        <input type="number" id="age" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date of Birth</label>
                        <input type="date" id="dateOfBirth" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mobile Number (10 digits)</label>
                    <input type="text" id="mobileNo" maxlength="10" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">City</label>
                        <input type="text" id="city" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">State</label>
                        <input type="text" id="state" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Sport</label>
                    <input type="text" id="sport" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition shadow-sm text-sm">Save Player</button>
            </form>
            <div id="formMessage" class="mt-4 text-xs text-center font-medium"></div>
        </section>

        <!-- Right Column: Player List & Simplified Search -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-2 border-b gap-4">
                <h2 class="text-lg font-semibold text-slate-900">Registered Players</h2>
                
                <!-- Simplified Search Bar -->
                <div class="flex gap-2 w-full sm:w-auto">
                    <input type="text" id="searchInput" placeholder="Search by name..." class="px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-60">
                    <button onclick="handleSearch()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Search</button>
                    <button onclick="fetchPlayers()" class="bg-slate-100 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-200 transition">Reset</button>
                </div>
            </div>

            <!-- Table Container -->
            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b text-xs uppercase text-slate-500 bg-slate-50">
                            <th class="p-3">ID</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Sport</th>
                            <th class="p-3">Contact</th>
                            <th class="p-3">Location</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody" class="text-sm divide-y">
                        <!-- Dynamic rows injected via script.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
